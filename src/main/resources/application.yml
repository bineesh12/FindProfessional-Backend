spring:
  application:
    name: find-professional-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/find_professional}
    username: ${DATABASE_USERNAME:find_professional}
    password: ${DATABASE_PASSWORD:find_professional}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}

app:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:500}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:8}
  catalog:
    nearby-default-radius-km: ${NEARBY_DEFAULT_RADIUS_KM:50}
    nearby-minimum-radius-km: ${NEARBY_MINIMUM_RADIUS_KM:1}
    nearby-maximum-radius-km: ${NEARBY_MAXIMUM_RADIUS_KM:100}
    nearby-result-limit: ${NEARBY_RESULT_LIMIT:10}
  location:
    postcode-resolver:
      base-url: ${POSTCODE_RESOLVER_BASE_URL:https://nominatim.openstreetmap.org}
      country-code: ${POSTCODE_COUNTRY_CODE:se}
      user-agent: ${POSTCODE_RESOLVER_USER_AGENT:FindProfessional-Marketplace/0.1}
      minimum-request-interval-millis: ${POSTCODE_RESOLVER_MINIMUM_INTERVAL_MILLIS:1000}
  auth:
    issuer: find-professional
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    phone-code-minutes: 10
    expose-phone-code: ${EXPOSE_PHONE_CODE:false}
    google-client-ids: ${GOOGLE_CLIENT_IDS:}
    firebase-project-id: ${FIREBASE_PROJECT_ID:}
